name: Android build and tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-project/**'
      - 'backend/**'
      - 'tests/**'
      - 'app-web/**'
      - 'scripts/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'android-project/**'
      - 'backend/**'
      - 'tests/**'
      - 'app-web/**'
      - 'scripts/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-project
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python for source and backend contract tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run source, SQLite and mocked-provider tests
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools' 'ndk;27.2.12479018' 'cmake;3.22.1'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify Gradle and Android SDK
        run: gradle --version && sdkmanager --list_installed

      - name: Run Android unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Run Android instrumentation tests on API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: cd android-project && gradle --no-daemon connectedDebugAndroidTest

      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ii-pauk-v0.39.3-debug-apk
          path: android-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ii-pauk-v0.39.3-android-test-reports
          path: |
            android-project/app/build/reports/tests/testDebugUnitTest/
            android-project/app/build/outputs/androidTest-results/connected/
            android-project/app/build/reports/androidTests/connected/
          if-no-files-found: ignore
          retention-days: 14
